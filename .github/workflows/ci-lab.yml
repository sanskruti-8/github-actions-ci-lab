
name: CI Lab Experiments

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Enter your name"
        required: true
        default: "Student"
        type: string
      city:
        description: "Select your city"
        required: true
        default: "Pune"
        type: choice
        options:
          - Pune
          - Mumbai
          - Nashik

jobs:
  example1:
    name: Example 1 - Simple Commands
    runs-on: ubuntu-latest
    steps:
      - name: Print messages
        run: |
          echo "Hello from GitHub Actions"
          echo "This is my first CI build"

  example2:
    name: Example 2 - Java Program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Java program
        run: javac Hello.java
      - name: Run Java program
        run: java Hello

  example3:
    name: Example 3 - Parameterized Build
    runs-on: ubuntu-latest
    steps:
      - name: Display user inputs
        env:
          USERNAME: ${{ inputs.username }}
          CITY: ${{ inputs.city }}
        run: |
          echo "Welcome $USERNAME"
          echo "Your selected city is $CITY"
